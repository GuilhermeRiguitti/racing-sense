packages:
  - "apps/*"

# Cada aplicação tem o próprio lockfile e o próprio node_modules. Nenhuma
# enxerga dependência da outra, e cada pasta de `apps/` instala sozinha — é o
# que deixa desktop, api e web virarem builds (ou containers) independentes.
sharedWorkspaceLockfile: false

# Pacotes autorizados a rodar script de instalação. O pnpm 10 bloqueia por
# padrão. Dentro do workspace vale esta lista; cada app repete a sua em
# `package.json` (campo `pnpm`) para instalar sozinha, fora do repositório.
#
# - electron: baixa o binário. Sem ele, `pnpm dev:desktop` falha com
#   "Electron uninstall".
# - prisma / @prisma/engines: baixam o motor de migrations.
# - @swc/core, esbuild: baixam o binário do compilador.
#
# better-sqlite3 fica de fora de propósito: ele já traz binário pronto em
# prebuilds/ (N-API, serve para Node e Electron), e liberar o script faz o pnpm
# chamar node-gyp, que exige Python e falha.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/engines"
  - "@swc/core"
  - "electron"
  - "esbuild"
  - "prisma"
  - "sharp"

ignoredBuiltDependencies:
  # telemetria de uso do swagger-ui; não precisa rodar nada na instalação
  - "@scarf/scarf"
